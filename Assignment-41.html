<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 41 - Responsive Design</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }

        .card span {
            font-size: 45px;
        }

        /* Breakpoint 1: Tablet */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            header {
                background: #2563eb;
            }
        }

        /* Breakpoint 2: Mobile */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            header {
                padding: 18px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Desktop, tablet and mobile layout</p>
    </header>

    <main class="container">
        <article class="card">
            <span aria-hidden="true">💻</span>
            <h2>Web Development</h2>
            <p>Learn HTML and CSS.</p>
        </article>

        <article class="card">
            <span aria-hidden="true">🤖</span>
            <h2>Artificial Intelligence</h2>
            <p>Explore AI technology.</p>
        </article>

        <article class="card">
            <span aria-hidden="true">🚀</span>
            <h2>My Projects</h2>
            <p>Build creative projects.</p>
        </article>
    </main>

</body>
</html>

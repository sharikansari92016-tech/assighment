<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 27 - Card Designs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 220px;
            padding: 20px;
            background: white;
            box-sizing: border-box;
        }

        .card-one {
            background: #dbeafe;
            border-radius: 5px;
            border: 2px solid #2563eb;
        }

        .card-two {
            background: #dcfce7;
            border-radius: 20px;
            border: 2px solid #16a34a;
        }

        .card-three {
            background: #fce7f3;
            border-radius: 35px;
            border: 2px solid #db2777;
        }
    </style>
</head>
<body>
    <h1>My Three Card Designs</h1>

    <div class="container">
        <div class="card card-one">
            <h2>Basic Card</h2>
            <p>Simple background with small rounded corners.</p>
        </div>

        <div class="card card-two">
            <h2>Premium Card</h2>
            <p>Green background with rounded corners.</p>
        </div>

        <div class="card card-three">
            <h2>Creative Card</h2>
            <p>Pink background with large rounded corners.</p>
        </div>
    </div>
</body>

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 30 - Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px 20px;
        }

        .profile-card {
            max-width: 320px;
            margin: auto;
            padding: 30px 20px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px #00000018;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            color: #1e1b4b;
            font-size: 24px;
        }

        p {
            color: #64748b;
            line-height: 1.5;
        }

        .tag {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 7px 12px;
            border-radius: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 22px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">SR</div>

        <h1>My Profile</h1>
        <p>BCA AI Student</p>

        <span class="tag">Learning Web Development</span>

        <p>I enjoy learning programming and creating useful websites.</p>

        <a href="index.html" class="button">Visit My Website</a>
    </div>

</body>
</html>
```

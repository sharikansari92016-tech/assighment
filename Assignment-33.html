```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 33 - Product Listing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .product {
            flex: 1 1 200px;
            max-width: 300px;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }

        .product-icon {
            font-size: 55px;
        }

        .price {
            color: #15803d;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>My Product Store</h1>

    <main class="products">
        <div class="product">
            <div class="product-icon">🎧</div>
            <h2>Headphones</h2>
            <p>Comfortable wireless headphones.</p>
            <p class="price">₹999</p>
            <button type="button">View Product</button>
        </div>

        <div class="product">
            <div class="product-icon">⌚</div>
            <h2>Smart Watch</h2>
            <p>A smart watch for everyday use.</p>
            <p class="price">₹1,499</p>
            <button type="button">View Product</button>
        </div>

        <div class="product">
            <div class="product-icon">🎒</div>
            <h2>Backpack</h2>
            <p>A useful bag for college students.</p>
            <p class="price">₹799</p>
            <button type="button">View Product</button>
        </div>
    </main>

</body>
</html>
```

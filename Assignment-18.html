
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Size Chart</title>
</head>
<body>
    <h1>T-Shirt Size Chart</h1>
    <p>Choose the correct size before ordering.</p>

    <table border="1">
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (inches)</th>
                <th>Length (inches)</th>
                <th>Price (₹)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>S</td>
                <td>36</td>
                <td>26</td>
                <td>499</td>
            </tr>
            <tr>
                <td>M</td>
                <td>38</td>
                <td>27</td>
                <td>549</td>
            </tr>
            <tr>
                <td>L</td>
                <td>40</td>
                <td>28</td>
                <td>599</td>
            </tr>
            <tr>
                <td>XL</td>
                <td>42</td>
                <td>29</td>
                <td>649</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

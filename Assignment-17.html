
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18">
        <br><br>

        <label for="date">Available From:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">
        <br><br>

        <p>Work Type:</p>
        <input type="radio" id="remote" name="work" value="remote">
        <label for="remote">Remote</label>

        <input type="radio" id="office" name="work" value="office">
        <label for="office">Office</label>
        <br><br>

        <label for="role">Choose Role:</label>
        <select id="role" name="role">
            <option value="">Select a role</option>
            <option value="web">Web Developer</option>
            <option value="software">Software Developer</option>
            <option value="ai">AI Intern</option>
        </select>
        <br><br>

        <label for="message">Why should we select you?</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="35"></textarea>
        <br><br>

        <label for="website">Portfolio URL:</label>
        <input type="url" id="website" name="website">
        <br><br>

        <input type="checkbox" id="confirm" name="confirm" required>
        <label for="confirm">I confirm my details are correct.</label>
        <br><br>

        <button type="submit">Apply Now</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
